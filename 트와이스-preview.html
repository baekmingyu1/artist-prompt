<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWICE JSON Preview</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d7dfeb;
      --text: #1d2733;
      --subtle: #5d6b7b;
      --point: #0f766e;
      --point-soft: #d8f3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 22%),
        linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #155e75 100%);
      color: #fff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 118, 110, 0.18);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .hero h1 {
      margin-top: 16px;
      font-size: 36px;
      line-height: 1.2;
    }

    .hero p {
      margin-top: 14px;
      max-width: 820px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
      white-space: pre-line;
    }

    .grid {
      display: grid;
      gap: 20px;
      margin-top: 24px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .card {
      grid-column: span 12;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(20, 34, 51, 0.06);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .meta-item {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 16px;
    }

    .meta-item dt {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }

    .meta-item dd {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .info-table th,
    .info-table td {
      border-bottom: 1px solid var(--line);
      padding: 14px 10px;
      text-align: left;
      vertical-align: top;
    }

    .info-table th {
      width: 160px;
      color: var(--subtle);
      font-weight: 600;
    }

    .text-block {
      line-height: 1.8;
      white-space: pre-line;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 120px 140px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
    }

    .badge {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--point-soft);
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .date {
      font-weight: 700;
      color: var(--text);
    }

    .sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--subtle);
    }

    .two-col {
      grid-column: span 6;
    }

    .full {
      grid-column: span 12;
    }

    .code {
      margin-top: 24px;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 20px;
      padding: 20px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 920px) {
      .meta,
      .timeline-item {
        grid-template-columns: 1fr;
      }

      .two-col {
        grid-column: span 12;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

    </section>

    <section class="grid">
      <article class="card two-col">

          <tbody id="profileTable"></tbody>
        </table>
      </article>

      <article class="card two-col">

      </article>

      <article class="card full">
        <h2>주요 공연 이력</h2>
        <div class="timeline" id="performances"></div>
      </article>

      <article class="card full">
        <h2>원본 JSON 느낌</h2>
        <pre class="code" id="rawJson"></pre>
      </article>
    </section>
  </div>

        "universe": "트와이스는 특정한 서사형 세계관을 장기간 고정해 이어 가는 팀이라기보다, 각 시기의 감정과 관계를 콘셉트로 풀어내는 방식이 더 뚜렷한 그룹이에요. 이들의 중심축은 사랑, 설렘, 흔들림, 위로, 자신감처럼 누구나 공감할 수 있는 감정을 음악 안에 또렷하게 배치하는 데 있어요. 이런 콘셉트는 밝은 멜로디와 포인트 안무로 드러날 때도 있고, 'Feel Special'처럼 서로를 일으키는 메시지나 'THIS IS FOR'처럼 자신감과 응원의 언어로 확장되기도 해요. 그래서 트와이스의 콘셉트는 복잡한 설정을 해석하는 구조라기보다, 팀의 변화와 성장을 감정의 흐름으로 이해하게 만드는 장치에 가까워요. 이 점이 팀의 정체성을 오래 유지하게 했고, 다양한 장르 변화도 자연스럽게 받아들이게 하는 기반이 됐어요.",

    function formatDate(value) {
      if (!value || value === "NULL") return "-";
      return value.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
    }

    function row(label, value) {
      return "<tr><th>" + label + "</th><td>" + (value || "-") + "</td></tr>";
    }

    function normalizeMultiline(value) {
      if (!value || value === "NULL") return "-";
      return String(value).replace(/\\n/g, "\n");
    }

    document.getElementById("activityEra").textContent = data.activity_info.activity_era.join(", ");
    document.getElementById("nationality").textContent = data.profile.nationality;
    document.getElementById("universe").textContent = normalizeMultiline(data.introduction.universe);
    document.getElementById("interview").textContent = normalizeMultiline(data.introduction.interview);

    document.getElementById("profileTable").innerHTML =

      row("생년월일", formatDate(data.profile.birth_date)) +
      row("MBTI", data.profile.mbti) +
      row("국적", data.profile.nationality);

    document.getElementById("performances").innerHTML = data.performances.map(function (item) {
      const period = item.start_date === item.end_date
        ? formatDate(item.start_date)
        : formatDate(item.start_date) + " - " + formatDate(item.end_date);

        "<div><span class='badge'>" + item.type + "</span></div>",
        "<div class='date'>" + period + "</div>",
        "<div><strong>" + item.title + "</strong></div>",
        "</div>"
      ].join("");
    }).join("");

    document.getElementById("rawJson").textContent = JSON.stringify(data, null, 2);
