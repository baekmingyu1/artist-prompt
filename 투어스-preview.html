<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWS JSON Preview</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d7dfeb;
      --text: #1d2733;
      --subtle: #5d6b7b;
      --point: #0f766e;
      --point-soft: #d8f3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 22%),
        linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #155e75 100%);
      color: #fff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 118, 110, 0.18);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .hero h1 {
      margin-top: 16px;
      font-size: 36px;
      line-height: 1.2;
    }

    .hero p {
      margin-top: 14px;
      max-width: 820px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
      white-space: pre-line;
    }

    .grid {
      display: grid;
      gap: 20px;
      margin-top: 24px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .card {
      grid-column: span 12;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(20, 34, 51, 0.06);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .meta-item {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 16px;
    }

    .meta-item dt {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }

    .meta-item dd {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .info-table th,
    .info-table td {
      border-bottom: 1px solid var(--line);
      padding: 14px 10px;
      text-align: left;
      vertical-align: top;
    }

    .info-table th {
      width: 160px;
      color: var(--subtle);
      font-weight: 600;
    }

    .text-block {
      line-height: 1.8;
      white-space: pre-line;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 120px 110px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
    }

    .badge {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--point-soft);
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
    }

    .date {
      font-weight: 700;
      color: var(--text);
    }

    .sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--subtle);
    }

    .two-col {
      grid-column: span 6;
    }

    .full {
      grid-column: span 12;
    }

    .code {
      margin-top: 24px;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 20px;
      padding: 20px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 920px) {
      .meta,
      .timeline-item {
        grid-template-columns: 1fr;
      }

      .two-col {
        grid-column: span 12;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <span class="eyebrow">JSON 웹 미리보기</span>
      <h1>TWS (투어스)</h1>
      <p id="summary"></p>
      <dl class="meta">
        <div class="meta-item">
          <dt>데뷔일</dt>
          <dd id="debutDate"></dd>
        </div>
        <div class="meta-item">
          <dt>데뷔곡</dt>
          <dd id="debutSong"></dd>
        </div>
        <div class="meta-item">
          <dt>활동 시기</dt>
          <dd id="activityEra"></dd>
        </div>
        <div class="meta-item">
          <dt>국적</dt>
          <dd id="nationality"></dd>
        </div>
      </dl>
    </section>

    <section class="grid">
      <article class="card two-col">
        <h2>기본 프로필</h2>
        <table class="info-table">
          <tbody id="profileTable"></tbody>
        </table>
      </article>

      <article class="card two-col">
        <h2>세계관 / 인터뷰 톤</h2>
        <div class="text-block" id="universe"></div>
        <div class="sub" style="margin-top: 18px;">대표 메시지</div>
        <div class="text-block" id="interview" style="margin-top: 8px;"></div>
      </article>

      <article class="card full">
        <h2>주요 공연 이력</h2>
        <div class="timeline" id="performances"></div>
      </article>

      <article class="card full">
        <h2>원본 JSON 느낌</h2>
        <pre class="code" id="rawJson"></pre>
      </article>
    </section>
  </div>

  <script>
    const data = {
      "artist_name": "TWS (투어스)",
      "activity_info": {
        "debut_date": "20240122",
        "debut_song": "첫 만남은 계획대로 되지 않아",
        "activity_era": [
          "2020"
        ]
      },
      "introduction": {
        "summary": "플레디스 엔터테인먼트에서 2024년 1월에 선보인 6인조 보이그룹 투어스는 'Twenty Four Seven With Us'라는 의미를 담아 일상의 모든 순간을 함께한다는 정체성을 지니고 데뷔했습니다. 이들은 독자적인 장르인 '보이후드 팝(Boyhood Pop)'을 내세우며, 억지로 꾸며낸 모습보다는 소년 시절의 순수하고 자연스러운 감성을 음악적 핵심 키워드로 삼고 있습니다.\n\n데뷔 초기 투어스는 청량한 선율과 일상적인 가사를 결합한 음악을 통해 대중에게 친근하게 다가갔습니다. 특히 데뷔곡에서 보여준 드럼 앤 베이스와 신스 팝의 조화는 팀이 지향하는 밝고 건강한 에너지를 명확하게 각인시켰습니다. 이후 발표한 작품들에서는 청량함의 농도를 조절하며 감성적인 면모를 더하거나, 리드미컬한 요소를 강화하여 음악적 완성도를 높이는 과정을 거쳤습니다. 이는 단순히 밝은 분위기에 머물지 않고 청춘이 느끼는 미묘한 설렘과 고민을 입체적으로 연결하려는 변화로 해석됩니다.\n\n현재 투어스는 화려한 기교보다는 탄탄한 라이브 안정성과 멤버 간의 조화로운 퍼포먼스 밸런스에 집중하고 있습니다. 특정 멤버의 돌출보다는 육각형의 고른 역량을 바탕으로 팀 전체의 일체감을 강조하며, 듣기 편안하면서도 세련된 이지리스닝 음악을 통해 전 세대를 아우르는 방향성을 정립해 나가고 있습니다. 이들은 앞으로도 일상 속의 작은 소중함을 음악으로 기록하며 팬들과 정서적 유대감을 쌓아가는 활동을 이어갈 계획입니다.",
        "universe": "투어스의 세계관은 인위적인 설정이나 거대한 서사 대신 '우리들의 일상적 기록과 성장의 공유'라는 현실 기반의 정서적 연결을 핵심 가치로 삼습니다. 이러한 방향성은 화려한 시각 효과보다는 학교, 거리, 바다와 같은 익숙한 공간을 배경으로 한 뮤직비디오 연출과 소년들의 관계성을 강조하는 서정적인 가사 키워드를 통해 구체적으로 표현됩니다. 이는 과도한 콘셉트의 피로감을 덜어내고 아티스트와 팬이 동시대를 함께 살아가는 동료로서 소통할 수 있는 틀을 제공하며, 팀의 인간적인 면모를 강조하는 정체성 확립 장치로 기능합니다.",
        "interview": "투어스는 계산된 완벽함보다 매 순간 최선을 다하는 진심이 팬들에게 가장 큰 울림을 줄 수 있다는 가치를 최우선으로 생각합니다."
      },
      "profile": {
        "real_name": "NULL",
        "birth_date": "NULL",
        "mbti": "NULL",
        "nationality": "대한민국"
      },
      "performances": [
        {
          "type": "쇼케이스",
          "start_date": "20240122",
          "end_date": "20240122",
          "title": "TWS 1st Mini Album 'Sparkling Blue' Debut Showcase"
        },
        {
          "type": "팬콘서트",
          "start_date": "20240122",
          "end_date": "20240122",
          "title": "TWS Debut Showcase 'Sparkling Blue'"
        },
        {
          "type": "페스티벌",
          "start_date": "20240302",
          "end_date": "20240302",
          "title": "제38회 마이ナ비 도쿄 걸즈 컬렉션 2024 SPRING/SUMMER"
        },
        {
          "type": "쇼케이스",
          "start_date": "20240624",
          "end_date": "20240624",
          "title": "TWS 2nd Mini Album 'SUMMER BEAT!' Media Showcase"
        },
        {
          "type": "페스티벌",
          "start_date": "20240817",
          "end_date": "20240817",
          "title": "SUMMER SONIC 2024 (Tokyo)"
        },
        {
          "type": "페스티벌",
          "start_date": "20240818",
          "end_date": "20240818",
          "title": "SUMMER SONIC 2024 (Osaka)"
        },
        {
          "type": "페스티벌",
          "start_date": "20240907",
          "end_date": "20240907",
          "title": "제39회 마이ナ비 도쿄 걸즈 컬렉션 2024 AUTUMN/WINTER"
        },
        {
          "type": "팬미팅",
          "start_date": "20241130",
          "end_date": "20241201",
          "title": "2024 TWS FANMEETING 'TWS 1st Time' in SEOUL"
        },
        {
          "type": "콘서트",
          "start_date": "20250215",
          "end_date": "20250216",
          "title": "TWS 1st Album Release Memorial Showcase"
        }
      ]
    };

    function formatDate(value) {
      if (!value || value === "NULL") return "-";
      return value.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
    }

    function row(label, value) {
      return "<tr><th>" + label + "</th><td>" + (value || "-") + "</td></tr>";
    }

    function normalizeMultiline(value) {
      if (!value || value === "NULL") return "-";
      return String(value).replace(/\\n/g, "\n");
    }

    document.getElementById("summary").textContent = normalizeMultiline(data.introduction.summary);
    document.getElementById("debutDate").textContent = formatDate(data.activity_info.debut_date);
    document.getElementById("debutSong").textContent = data.activity_info.debut_song;
    document.getElementById("activityEra").textContent = data.activity_info.activity_era.join(", ");
    document.getElementById("nationality").textContent = data.profile.nationality;
    document.getElementById("universe").textContent = normalizeMultiline(data.introduction.universe);
    document.getElementById("interview").textContent = normalizeMultiline(data.introduction.interview);

    document.getElementById("profileTable").innerHTML =
      row("아티스트명", data.artist_name) +
      row("실명", data.profile.real_name) +
      row("생년월일", formatDate(data.profile.birth_date)) +
      row("MBTI", data.profile.mbti) +
      row("국적", data.profile.nationality);

    document.getElementById("performances").innerHTML = data.performances.map(function (item) {
      const period = item.start_date === item.end_date
        ? formatDate(item.start_date)
        : formatDate(item.start_date) + " - " + formatDate(item.end_date);

      return [
        "<div class='timeline-item'>",
        "<div><span class='badge'>" + item.type + "</span></div>",
        "<div class='date'>" + period + "</div>",
        "<div><strong>" + item.title + "</strong></div>",
        "</div>"
      ].join("");
    }).join("");

    document.getElementById("rawJson").textContent = JSON.stringify(data, null, 2);
  </script>
</body>
</html>
