<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAY6 JSON Preview</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d7dfeb;
      --text: #1d2733;
      --subtle: #5d6b7b;
      --point: #0f766e;
      --point-soft: #d8f3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), transparent 22%),
        linear-gradient(180deg, #eef4fb 0%, #f7f9fc 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e 0%, #155e75 100%);
      color: #fff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 118, 110, 0.18);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .hero h1 {
      margin-top: 16px;
      font-size: 36px;
      line-height: 1.2;
    }

    .hero p {
      margin-top: 14px;
      max-width: 820px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
      white-space: pre-line;
    }

    .grid {
      display: grid;
      gap: 20px;
      margin-top: 24px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
    }

    .card {
      grid-column: span 12;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(20, 34, 51, 0.06);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .meta-item {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 16px;
    }

    .meta-item dt {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }

    .meta-item dd {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .info-table th,
    .info-table td {
      border-bottom: 1px solid var(--line);
      padding: 14px 10px;
      text-align: left;
      vertical-align: top;
    }

    .info-table th {
      width: 160px;
      color: var(--subtle);
      font-weight: 600;
    }

    .text-block {
      line-height: 1.8;
      white-space: pre-line;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 120px 110px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
    }

    .badge {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--point-soft);
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
    }

    .date {
      font-weight: 700;
      color: var(--text);
    }

    .sub {
      margin-top: 6px;
      font-size: 13px;
      color: var(--subtle);
    }

    .two-col {
      grid-column: span 6;
    }

    .full {
      grid-column: span 12;
    }

    .code {
      margin-top: 24px;
      background: #0f172a;
      color: #dbeafe;
      border-radius: 20px;
      padding: 20px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 920px) {
      .meta,
      .timeline-item {
        grid-template-columns: 1fr;
      }

      .two-col {
        grid-column: span 12;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <span class="eyebrow">JSON 웹 미리보기</span>
      <h1>DAY6</h1>
      <p id="summary"></p>
      <dl class="meta">
        <div class="meta-item">
          <dt>데뷔일</dt>
          <dd id="debutDate"></dd>
        </div>
        <div class="meta-item">
          <dt>데뷔곡</dt>
          <dd id="debutSong"></dd>
        </div>
        <div class="meta-item">
          <dt>활동 시기</dt>
          <dd id="activityEra"></dd>
        </div>
        <div class="meta-item">
          <dt>국적</dt>
          <dd id="nationality"></dd>
        </div>
      </dl>
    </section>

    <section class="grid">
      <article class="card two-col">
        <h2>기본 프로필</h2>
        <table class="info-table">
          <tbody id="profileTable"></tbody>
        </table>
      </article>

      <article class="card two-col">
        <h2>세계관 / 인터뷰 톤</h2>
        <div class="text-block" id="universe"></div>
        <div class="sub" style="margin-top: 18px;">대표 메시지</div>
        <div class="text-block" id="interview" style="margin-top: 8px;"></div>
      </article>

      <article class="card full">
        <h2>주요 공연 이력</h2>
        <div class="timeline" id="performances"></div>
      </article>

      <article class="card full">
        <h2>원본 JSON 느낌</h2>
        <pre class="code" id="rawJson"></pre>
      </article>
    </section>
  </div>

  <script>
    const data = {
      "artist_name": "DAY6",
      "activity_info": {

      },
      "introduction": {
        "summary": "DAY6는 JYP엔터테인먼트 소속 밴드로, 2015년 미니앨범 'The Day'와 타이틀곡 'Congratulations'로 데뷔했어요. 출발부터 아이돌 문법보다 밴드 합주와 자작곡 역량을 전면에 둔 팀이었고, 기타·베이스·드럼·건반 위에 여러 멤버의 보컬을 교차시키는 방식으로 자기 색을 만들었어요. 초기 음악은 이별, 불안, 청춘의 흔들림을 팝록과 록 발라드에 담아 감정을 직접적으로 전달하는 데 힘이 있었어요.\n\n이후 DAY6는 한 달 단위 발표 프로젝트와 'The Book of Us' 시리즈를 거치며 팀의 서사를 더 넓혔어요. 곡의 구조와 사운드는 점점 정교해졌고, 감정의 크기를 키우기보다 일상적인 언어와 멜로디로 오래 남는 여운을 만드는 쪽으로 무게가 옮겨갔어요. 강한 록 사운드, 서정적인 피아노 중심 곡, 대합창형 후렴을 모두 소화하면서도 '밴드가 직접 쌓아 올리는 감정선'이라는 중심은 유지했어요.\n\n최근의 DAY6는 재결합 이후 'Fourever', 'Band Aid', 'Maybe Tomorrow', 'The DECADE'로 이어지는 흐름 안에서 팀의 현재를 더 분명하게 정리하고 있어요. 네 멤버의 합을 전면에 내세우고, 상처를 견디는 마음과 다시 살아가는 힘, 그리고 시간이 지나도 이어지는 관계를 노래하는 방향이 뚜렷해졌어요. 라이브에서는 각 멤버의 음색 차이와 합창형 코러스, 안정적인 연주 밸런스가 강점으로 작동하며, DAY6의 음악이 왜 무대에서 더 설득력 있게 들리는지를 보여줘요.",
        "universe": "DAY6의 세계관은 거대한 허구 서사보다 시간, 관계, 상처, 회복처럼 누구나 겪는 감정을 이어 붙이는 구조에 가까워요. 이 팀은 'The Book of Us', 'Fourever', 'Band Aid', 'Maybe Tomorrow', 'The DECADE'처럼 앨범 제목부터 삶의 국면과 감정의 흐름을 하나의 연속선으로 묶어 왔어요. 이런 세계는 가사의 일상적 문장, 록과 발라드를 오가는 편곡, 뮤직비디오와 티징에서 보이는 계절감과 서정적 이미지로 드러나요. 이 구조가 중요한 이유는 DAY6의 음악을 단순한 사랑 노래 모음이 아니라, 시간 속에서 사람이 흔들리고 버티고 다시 나아가는 기록으로 읽게 만들기 때문이에요. 다시 말해 DAY6의 세계관은 해석을 강요하는 장치가 아니라, 팀의 정체성과 음악적 확장을 자연스럽게 설명해 주는 감정의 틀이에요.",
        "interview": "DAY6의 핵심 가치는 자기 경험에 가까운 감정을 밴드 사운드로 솔직하게 전달하는 데 있어요. 화려한 설정보다 오래 들을 수 있는 노래, 그리고 무대에서 더 선명해지는 진심을 중요하게 여기는 팀으로 정리할 수 있어요."
      },
      "profile": {

        "birth_date": "NULL",
        "mbti": "NULL",

      "performances": [

        },
        {

        {

          "start_date": "20250830",

        },
        {

          "end_date": "20260322",
          "title": "DAY6 10th Anniversary Tour <The DECADE> in DAEJEON"
        }
      ]
    };

    function formatDate(value) {
      if (!value || value === "NULL") return "-";
      return value.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
    }

    function row(label, value) {
      return "<tr><th>" + label + "</th><td>" + (value || "-") + "</td></tr>";
    }

    function normalizeMultiline(value) {
      if (!value || value === "NULL") return "-";
      return String(value).replace(/\\n/g, "\n");
    }

    document.getElementById("summary").textContent = normalizeMultiline(data.introduction.summary);
    document.getElementById("debutDate").textContent = formatDate(data.activity_info.debut_date);
    document.getElementById("debutSong").textContent = data.activity_info.debut_song;
    document.getElementById("activityEra").textContent = data.activity_info.activity_era.join(", ");
    document.getElementById("nationality").textContent = data.profile.nationality;
    document.getElementById("universe").textContent = normalizeMultiline(data.introduction.universe);
    document.getElementById("interview").textContent = normalizeMultiline(data.introduction.interview);

    document.getElementById("profileTable").innerHTML =
      row("아티스트명", data.artist_name) +
      row("실명", data.profile.real_name) +
      row("생년월일", formatDate(data.profile.birth_date)) +
      row("MBTI", data.profile.mbti) +
      row("국적", data.profile.nationality);

    document.getElementById("performances").innerHTML = data.performances.map(function (item) {
      const period = item.start_date === item.end_date
        ? formatDate(item.start_date)
        : formatDate(item.start_date) + " - " + formatDate(item.end_date);

      return [
        "<div class='timeline-item'>",
        "<div><span class='badge'>" + item.type + "</span></div>",
        "<div class='date'>" + period + "</div>",
        "<div><strong>" + item.title + "</strong></div>",
        "</div>"
      ].join("");
    }).join("");

    document.getElementById("rawJson").textContent = JSON.stringify(data, null, 2);
  </script>
</body>
</html>
